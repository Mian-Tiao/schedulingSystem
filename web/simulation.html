<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>情境模擬 — 智慧排程系統</title>
    <link rel="stylesheet" href="base.css" />
    <!-- 需要自訂樣式的話,建立 simulation.css 後在這裡引入 -->
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-brand">智慧排程系統<small>Lean Scheduling Assistant</small></div>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">首頁</a>
        <a class="nav-link" href="orders.html">訂單管理</a>
        <a class="nav-link" href="machines.html">機台管理</a>
        <a class="nav-link" href="scheduling.html">排程中心</a>
        <a class="nav-link" href="gantt.html">甘特圖</a>
        <a class="nav-link active" href="simulation.html">情境模擬</a>
      </div>
    </nav>

    <div class="container">
      <div class="page-header">
        <div>
          <h1 class="page-title">情境模擬</h1>
          <p class="page-subtitle">急單插入、機台故障模擬。結果不會寫入正式排程。</p>
        </div>
      </div>

      <div id="noScenario" class="banner banner-warn" hidden>
        目前沒有排程方案。請先到「排程中心」執行排程,再進行情境模擬。
      </div>

      <div id="main" hidden>
        <div class="banner banner-info" id="baseInfo"></div>

        <div class="flex" style="margin: 12px 0">
          <button class="btn btn-primary" id="tabUrgent">🚨 急單插入</button>
          <button class="btn btn-secondary" id="tabBreak">🔧 機台故障</button>
        </div>

        <!-- 急單 -->
        <div class="card" id="panelUrgent">
          <div class="card-title">急單資料</div>
          <div class="grid grid-3">
            <label class="field"><span class="field-label">急單編號<span class="req">*</span></span>
              <input class="input" id="uNumber" value="URGENT-001" /></label>
            <label class="field"><span class="field-label">產品<span class="req">*</span></span>
              <select class="input" id="uProduct"></select></label>
            <label class="field"><span class="field-label">數量<span class="req">*</span></span>
              <input class="input" id="uQty" type="number" min="1" value="10" /></label>
            <label class="field"><span class="field-label">可開始時間<span class="req">*</span></span>
              <input class="input" id="uRelease" type="datetime-local" /></label>
            <label class="field"><span class="field-label">交期<span class="req">*</span></span>
              <input class="input" id="uDue" type="datetime-local" /></label>
            <label class="field"><span class="field-label">優先級</span>
              <select class="input" id="uPriority">
                <option value="1" selected>1(急單通常為 1)</option><option value="2">2</option><option value="3">3</option>
              </select></label>
          </div>
          <button class="btn btn-primary" id="btnUrgent">▶ 執行急單模擬</button>
          <div id="urgentResult" class="mt-4"></div>
        </div>

        <!-- 故障 -->
        <div class="card" id="panelBreak" hidden>
          <div class="card-title">故障資訊</div>
          <div class="grid grid-3">
            <label class="field"><span class="field-label">故障機台<span class="req">*</span></span>
              <select class="input" id="bMachine"></select></label>
            <label class="field"><span class="field-label">故障開始時間<span class="req">*</span></span>
              <input class="input" id="bStart" type="datetime-local" /></label>
            <label class="field"><span class="field-label">預估修復時間<span class="req">*</span></span>
              <input class="input" id="bEnd" type="datetime-local" /></label>
          </div>
          <button class="btn btn-primary" id="btnBreak">▶ 執行故障模擬</button>
          <div id="breakResult" class="mt-4"></div>
        </div>
      </div>
    </div>

    <script src="common.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      let products = [], machines = [], topScenario = null;

      // 指標前後比較的小表格
      function metricsCompare(before, after) {
        const rows = [
          ['準時交貨率', pct(before.onTimeDeliveryRate), pct(after.onTimeDeliveryRate), after.onTimeDeliveryRate >= before.onTimeDeliveryRate],
          ['平均延遲', fmtMinutes(before.averageTardinessMinutes), fmtMinutes(after.averageTardinessMinutes), after.averageTardinessMinutes <= before.averageTardinessMinutes],
          ['延遲訂單', before.lateOrderCount + ' 張', after.lateOrderCount + ' 張', after.lateOrderCount <= before.lateOrderCount],
          ['Makespan', fmtMinutes(before.makespanMinutes), fmtMinutes(after.makespanMinutes), after.makespanMinutes <= before.makespanMinutes],
        ];
        return `<table class="table"><thead><tr><th>指標</th><th>調整前</th><th>調整後</th></tr></thead><tbody>${
          rows.map((r) => `<tr><td class="muted">${r[0]}</td><td class="faint">${r[1]}</td>
            <td style="font-weight:600;color:${r[3] ? 'var(--success)' : 'var(--danger)'}">${r[2]}</td></tr>`).join('')
        }</tbody></table>`;
      }

      // ====== 切換分頁 ======
      $('tabUrgent').addEventListener('click', () => switchTab('urgent'));
      $('tabBreak').addEventListener('click', () => switchTab('break'));
      function switchTab(which) {
        const u = which === 'urgent';
        $('panelUrgent').hidden = !u;
        $('panelBreak').hidden = u;
        $('tabUrgent').className = 'btn ' + (u ? 'btn-primary' : 'btn-secondary');
        $('tabBreak').className = 'btn ' + (u ? 'btn-secondary' : 'btn-primary');
      }

      // ====== 急單模擬 ======
      $('btnUrgent').addEventListener('click', async () => {
        $('urgentResult').innerHTML = '<span class="spinner"></span> 模擬中…';
        try {
          const r = await api('/simulations/urgent-order', { method: 'POST', body: {
            scenarioId: topScenario.scenarioId,
            order: {
              orderNumber: $('uNumber').value.trim(),
              productId: $('uProduct').value,
              quantity: Number($('uQty').value),
              releaseTime: fromLocalInput($('uRelease').value),
              dueDate: fromLocalInput($('uDue').value),
              priority: Number($('uPriority').value),
            },
          }});
          const urgentBadge = (min) => min === 0
            ? '<span class="badge badge-green">✓ 準時完成</span>'
            : `<span class="badge badge-red">延遲 ${fmtMinutes(min || 0)}</span>`;
          const insert = r.insert.ok
            ? `${metricsCompare(r.baseline.metrics, r.insert.metrics)}
               <p class="mt-2">急單預計 ${urgentBadge(r.insert.urgentTardinessMinutes)}</p>
               <p class="small faint">此策略不影響任何既有訂單。</p>`
            : `<div class="banner banner-error">${escapeHtml(r.insert.reason)}</div>`;
          const affected = (r.rebuild.affectedOrders || []).length
            ? `<p class="small" style="font-weight:600;margin-top:8px">受影響的訂單:</p>
               <table class="table"><thead><tr><th>訂單</th><th>完成時間變化</th><th>延遲變化</th></tr></thead><tbody>${
                 r.rebuild.affectedOrders.map((i) => `<tr><td>${escapeHtml(i.orderNumber)}${i.becameLate ? ' <span class="badge badge-red">變逾期</span>' : ''}</td>
                   <td class="small muted">${i.oldCompletion ? fmtDateTime(i.oldCompletion) : '—'} → ${i.newCompletion ? fmtDateTime(i.newCompletion) : '未排入'}</td>
                   <td class="small">${i.oldTardinessMinutes} 分 → <span style="color:${i.newTardinessMinutes > i.oldTardinessMinutes ? 'var(--danger)' : 'var(--success)'}">${i.newTardinessMinutes} 分</span></td></tr>`).join('')
               }</tbody></table>`
            : '<p class="small faint mt-2">沒有訂單受影響。</p>';
          $('urgentResult').innerHTML = `<div class="grid grid-2">
            <div class="card"><div class="card-title">策略一:插入目前排程(既有訂單不動)</div>${insert}</div>
            <div class="card"><div class="card-title">策略二:重新計算全部排程(含急單)</div>
              ${metricsCompare(r.baseline.metrics, r.rebuild.metrics)}
              <p class="mt-2">急單預計 ${urgentBadge(r.rebuild.urgentTardinessMinutes)}</p>${affected}</div>
          </div>`;
        } catch (err) { $('urgentResult').innerHTML = `<div class="banner banner-error">${escapeHtml(err.message)}</div>`; }
      });

      // ====== 故障模擬 ======
      $('btnBreak').addEventListener('click', async () => {
        $('breakResult').innerHTML = '<span class="spinner"></span> 模擬中…';
        try {
          const r = await api('/simulations/machine-breakdown', { method: 'POST', body: {
            scenarioId: topScenario.scenarioId,
            machineId: $('bMachine').value,
            startTime: fromLocalInput($('bStart').value),
            estimatedRepairTime: fromLocalInput($('bEnd').value),
          }});
          const late = r.withEstimatedRepair.lateOrders;
          const lateHtml = late.length === 0
            ? '<div class="banner banner-success">在此修復時間下,沒有訂單會逾期。</div>'
            : `<p class="small" style="color:var(--danger)">將有 ${r.withEstimatedRepair.lateOrderCount} 張訂單逾期:</p>
               <ul class="small" style="margin:4px 0;padding-left:18px">${late.map((o) =>
                 `<li>${escapeHtml(o.orderNumber)} — 延遲 ${fmtMinutes(o.tardinessMinutes)}${o.priority <= 2 ? ' <span class="badge badge-red">重要</span>' : ''}</li>`).join('')}</ul>`;
          const sug = r.suggestions;
          const sugHtml = late.length ? `<div class="card"><div class="card-title">建議</div>
            <ul class="small muted" style="margin:0;padding-left:18px;line-height:1.9">
              <li>最少會有 ${sug.minimumLateOrderCount} 張訂單逾期</li>
              <li>可考慮轉移到:${sug.transferMachines.length ? sug.transferMachines.map((m) => escapeHtml(m.machineCode + ' ' + m.machineName)).join('、') : '(沒有其他機台可支援)'}</li>
              ${sug.priorityOrders.length ? '<li>建議優先處理:' + sug.priorityOrders.map(escapeHtml).join('、') + '</li>' : ''}
              ${sug.negotiableOrders.length ? '<li>可與客戶協調交期:' + sug.negotiableOrders.map(escapeHtml).join('、') + '</li>' : ''}
            </ul></div>` : '';
          $('breakResult').innerHTML = `
            <div class="card"><div class="card-title">情境一:按預估修復時間(${fmtDateTime(r.breakdown.estimatedRepairTime)} 修復)</div>
              ${metricsCompare(r.baseline.metrics, r.withEstimatedRepair.metrics)}${lateHtml}</div>
            <div class="card mt-4"><div class="card-title">情境二:反向分析 — 最晚何時要修好?</div>
              <div class="banner ${r.reverseAnalysis.latestSafeRepairTime ? 'banner-info' : 'banner-warn'}">${
                r.reverseAnalysis.latestSafeRepairTime
                  ? `最晚須於 ${fmtDateTime(r.reverseAnalysis.latestSafeRepairTime)} 前修復,重要訂單(優先級 ≤ 2)才不會逾期。`
                  : escapeHtml(r.reverseAnalysis.message)}</div></div>
            ${sugHtml ? '<div class="mt-4">' + sugHtml + '</div>' : ''}`;
        } catch (err) { $('breakResult').innerHTML = `<div class="banner banner-error">${escapeHtml(err.message)}</div>`; }
      });

      // ====== 啟動 ======
      (async () => {
        if (!(await checkBackend())) return;
        try {
          const scenarios = await api('/schedules');
          topScenario = scenarios.find((s) => s.rank === 1) || null;
          if (!topScenario) { $('noScenario').hidden = false; return; }
          [products, machines] = await Promise.all([api('/products'), api('/machines')]);
          $('uProduct').innerHTML = products.map((p) => `<option value="${p.id}">${escapeHtml(p.productCode)} ${escapeHtml(p.productName)}</option>`).join('');
          $('bMachine').innerHTML = machines.map((m) => `<option value="${m.id}">${escapeHtml(m.machineCode)} ${escapeHtml(m.machineName)}</option>`).join('');
          const now = new Date();
          $('uRelease').value = toLocalInput(now);
          $('uDue').value = toLocalInput(new Date(now.getTime() + 86400000));
          $('bStart').value = toLocalInput(now);
          $('bEnd').value = toLocalInput(new Date(now.getTime() + 4 * 3600000));
          $('baseInfo').innerHTML = `模擬以目前排名第一的方案(<b>${topScenario.algorithm}</b>)為基準,結果不會寫入正式排程。`;
          $('main').hidden = false;
        } catch (e) {
          document.querySelector('.container').insertAdjacentHTML('beforeend', `<div class="banner banner-error">${escapeHtml(e.message)}</div>`);
        }
      })();
    </script>
  </body>
</html>
