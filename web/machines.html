<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>機台管理 — 智慧排程系統</title>
    <link rel="stylesheet" href="base.css" />
    <!-- 需要自訂樣式的話,建立 machines.css 後在這裡引入 -->
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-brand">智慧排程系統<small>Lean Scheduling Assistant</small></div>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">首頁</a>
        <a class="nav-link" href="orders.html">訂單管理</a>
        <a class="nav-link active" href="machines.html">機台管理</a>
        <a class="nav-link" href="scheduling.html">排程中心</a>
        <a class="nav-link" href="gantt.html">甘特圖</a>
        <a class="nav-link" href="simulation.html">情境模擬</a>
      </div>
    </nav>

    <div class="container">
      <div class="page-header">
        <div>
          <h1 class="page-title">機台管理</h1>
          <p class="page-subtitle">機台資料、可加工產品、工作時段、維護停機、換模規則。</p>
        </div>
        <div class="flex">
          <button class="btn btn-secondary" id="btnRules">換模規則</button>
          <button class="btn btn-primary" id="btnAdd">+ 新增機台</button>
        </div>
      </div>

      <div id="listArea"><div class="state"><span class="spinner"></span> 讀取中…</div></div>
    </div>

    <!-- 新增/編輯機台 -->
    <div class="modal-overlay" id="formModal" hidden>
      <div class="modal modal-wide">
        <div class="modal-header">
          <h2 class="modal-title" id="formTitle">新增機台</h2>
          <button class="modal-close" data-close>✕</button>
        </div>
        <div id="formError"></div>
        <div class="grid grid-3">
          <label class="field"><span class="field-label">機台編號<span class="req">*</span></span>
            <input class="input" id="fldCode" placeholder="例如 M-01" /></label>
          <label class="field"><span class="field-label">機台名稱<span class="req">*</span></span>
            <input class="input" id="fldName" /></label>
          <label class="field"><span class="field-label">型號</span>
            <input class="input" id="fldModel" /></label>
          <label class="field"><span class="field-label">狀態</span>
            <select class="input" id="fldStatus">
              <option value="available">可用</option>
              <option value="maintenance">維護中(仍可排程)</option>
              <option value="disabled">停用(不參與排程)</option>
            </select></label>
          <label class="field"><span class="field-label">預設換模時間(分)</span>
            <input class="input" id="fldSetup" type="number" min="0" value="20" /></label>
          <label class="field"><span class="field-label">預設清洗時間(分)</span>
            <input class="input" id="fldClean" type="number" min="0" value="10" /></label>
        </div>
        <label class="field"><span class="field-label">可加工產品</span>
          <div class="flex flex-wrap" id="fldProducts"
            style="border: 1px solid var(--border); border-radius: 6px; padding: 8px"></div></label>
        <label class="field"><span class="field-label">每日工作時段</span>
          <span class="field-hint" style="margin: 0 0 6px">勾選有上班的日子並設定起訖時間。(此簡易版每天一個時段;若要午休分兩段,可到 React 版設定)</span>
          <div id="fldHours" style="border: 1px solid var(--border); border-radius: 6px; padding: 8px"></div></label>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-close>取消</button>
          <button class="btn btn-primary" id="btnSave">儲存</button>
        </div>
      </div>
    </div>

    <!-- 停機時段 -->
    <div class="modal-overlay" id="dtModal" hidden>
      <div class="modal">
        <div class="modal-header">
          <h2 class="modal-title" id="dtTitle">新增停機時段</h2>
          <button class="modal-close" data-close>✕</button>
        </div>
        <div id="dtError"></div>
        <label class="field"><span class="field-label">類型</span>
          <select class="input" id="dtType">
            <option value="maintenance">定期維護</option>
            <option value="breakdown">故障</option>
            <option value="plannedStop">計畫停機(如午休)</option>
            <option value="other">其他</option>
          </select></label>
        <label class="field"><span class="field-label">開始時間<span class="req">*</span></span>
          <input class="input" id="dtStart" type="datetime-local" /></label>
        <label class="field"><span class="field-label">結束時間<span class="req">*</span></span>
          <input class="input" id="dtEnd" type="datetime-local" /></label>
        <label class="field"><span class="field-label">原因</span>
          <input class="input" id="dtReason" placeholder="例如:每月定期保養" /></label>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-close>取消</button>
          <button class="btn btn-primary" id="btnDtSave">新增</button>
        </div>
      </div>
    </div>

    <!-- 換模規則 -->
    <div class="modal-overlay" id="rulesModal" hidden>
      <div class="modal modal-wide">
        <div class="modal-header">
          <h2 class="modal-title">產品切換換模規則</h2>
          <button class="modal-close" data-close>✕</button>
        </div>
        <div class="banner banner-info">
          設定「從產品 A 換到產品 B」所需的換模與清洗時間。未設定時使用機台預設值;同產品連續生產不需換模。
        </div>
        <div id="rulesArea"></div>
      </div>
    </div>

    <script src="common.js"></script>
    <script>
      let products = [];
      let machines = [];
      let rules = [];
      let editingId = null;
      let dtMachineId = null;

      const $ = (id) => document.getElementById(id);
      const WEEK = [['mon', '週一'], ['tue', '週二'], ['wed', '週三'], ['thu', '週四'], ['fri', '週五'], ['sat', '週六'], ['sun', '週日']];
      const DT_LABEL = { maintenance: '定期維護', breakdown: '故障', plannedStop: '計畫停機', other: '其他' };

      const productName = (id) => id === null ? '(空機/任何)' : (products.find((p) => p.id === id)?.productCode || '?');
      const machineName = (id) => id === null ? '所有機台' : (machines.find((m) => m.id === id)?.machineCode || '?');

      async function loadAll() {
        [products, machines, rules] = await Promise.all([api('/products'), api('/machines'), api('/changeover-rules')]);
        render();
      }

      // ====== 機台卡片列表 ======
      function render() {
        const area = $('listArea');
        if (machines.length === 0) {
          area.innerHTML = '<div class="state"><span class="state-icon">⚙️</span>尚未建立機台。</div>';
          return;
        }
        area.className = 'grid grid-2';
        area.innerHTML = machines.map(machineCard).join('');
      }

      function machineCard(m) {
        const statusBadge = { available: '<span class="badge badge-green">✓ 可用</span>',
          maintenance: '<span class="badge badge-amber">🔧 維護中</span>',
          disabled: '<span class="badge badge-slate">⛔ 停用</span>' }[m.status];
        const prods = m.supportedProductIds.length
          ? m.supportedProductIds.map((id) => `<span class="badge badge-slate">${escapeHtml(productName(id))}</span>`).join(' ')
          : '<span class="faint">(未設定)</span>';
        const hours = WEEK.filter(([k]) => (m.workingHours[k] || []).length)
          .map(([k, l]) => `${l} ${m.workingHours[k].map((s) => s.start + '-' + s.end).join('、')}`).join(';') || '(未設定)';
        const dts = (m.downtimes || []).length
          ? (m.downtimes || []).map((d) => `<li class="flex between small">
              <span><span class="badge ${d.type === 'breakdown' ? 'badge-red' : 'badge-amber'}">${DT_LABEL[d.type] || d.type}</span>
              ${fmtDateTime(d.startTime)} ~ ${fmtDateTime(d.endTime)}${d.reason ? ' <span class="faint">(' + escapeHtml(d.reason) + ')</span>' : ''}</span>
              <button class="btn btn-ghost btn-sm" data-deldt="${d.id}" data-m="${m.id}">✕</button></li>`).join('')
          : '<li class="small faint">無停機時段</li>';
        return `<div class="card">
          <div class="flex between">
            <div><h2 style="font-size:15px">${escapeHtml(m.machineCode)} ${escapeHtml(m.machineName)}
              ${m.model ? '<span class="small faint">' + escapeHtml(m.model) + '</span>' : ''}</h2>
              <div class="mt-2">${statusBadge}</div></div>
            <div class="nowrap">
              <button class="btn btn-ghost btn-sm" data-edit="${m.id}">編輯</button>
              <button class="btn btn-ghost btn-sm" data-del="${m.id}">刪除</button></div>
          </div>
          <div class="small muted mt-2" style="line-height:1.8">
            <div><span class="faint">可加工產品:</span> ${prods}</div>
            <div><span class="faint">預設換模/清洗:</span> ${m.defaultSetupTime} 分 / ${m.defaultCleaningTime} 分</div>
            <div><span class="faint">工作時段:</span> ${escapeHtml(hours)}</div>
          </div>
          <div class="mt-2" style="border-top:1px solid var(--border);padding-top:8px">
            <div class="flex between"><span class="small" style="font-weight:600;color:var(--text-muted)">維護/停機時段</span>
              <button class="btn btn-ghost btn-sm" data-adddt="${m.id}">+ 新增</button></div>
            <ul style="margin:4px 0 0;padding:0;list-style:none;line-height:2">${dts}</ul>
          </div></div>`;
      }

      // ====== 事件委派 ======
      $('listArea').addEventListener('click', async (e) => {
        const t = e.target.closest('button');
        if (!t) return;
        if (t.dataset.edit) return openForm(machines.find((m) => m.id === t.dataset.edit));
        if (t.dataset.del) {
          const m = machines.find((x) => x.id === t.dataset.del);
          if (confirm(`確定刪除機台「${m.machineName}」?其停機時段會一併刪除。`)) {
            try { await api(`/machines/${t.dataset.del}`, { method: 'DELETE' }); toast('已刪除', 'success'); loadAll(); }
            catch (err) { toast(err.message, 'error'); }
          }
        }
        if (t.dataset.adddt) openDt(t.dataset.adddt);
        if (t.dataset.deldt) {
          try { await api(`/machines/${t.dataset.m}/downtimes/${t.dataset.deldt}`, { method: 'DELETE' }); loadAll(); }
          catch (err) { toast(err.message, 'error'); }
        }
      });

      // ====== 機台表單 ======
      function openForm(m) {
        editingId = m ? m.id : null;
        $('formTitle').textContent = m ? '編輯機台' : '新增機台';
        $('formError').innerHTML = '';
        $('fldCode').value = m ? m.machineCode : '';
        $('fldName').value = m ? m.machineName : '';
        $('fldModel').value = m ? m.model || '' : '';
        $('fldStatus').value = m ? m.status : 'available';
        $('fldSetup').value = m ? m.defaultSetupTime : 20;
        $('fldClean').value = m ? m.defaultCleaningTime : 10;
        $('fldProducts').innerHTML = products.length
          ? products.map((p) => `<label class="check"><input type="checkbox" value="${p.id}" ${m && m.supportedProductIds.includes(p.id) ? 'checked' : ''}/> ${escapeHtml(p.productCode)} ${escapeHtml(p.productName)}</label>`).join('')
          : '<span class="small faint">請先建立產品</span>';
        // 工作時段:每天一列(checkbox + start + end)
        $('fldHours').innerHTML = WEEK.map(([k, l]) => {
          const seg = m && (m.workingHours[k] || [])[0];
          const on = m ? !!seg : k !== 'sat' && k !== 'sun';
          return `<div class="flex" style="margin-bottom:4px" data-day="${k}">
            <label class="check" style="width:64px"><input type="checkbox" class="day-on" ${on ? 'checked' : ''}/> ${l}</label>
            <input type="time" class="input day-start" style="width:120px" value="${seg ? seg.start : '08:00'}" />
            <span>-</span>
            <input type="time" class="input day-end" style="width:120px" value="${seg ? seg.end : '17:00'}" /></div>`;
        }).join('');
        $('formModal').hidden = false;
      }

      $('btnSave').addEventListener('click', async () => {
        $('formError').innerHTML = '';
        const workingHours = {};
        $('fldHours').querySelectorAll('[data-day]').forEach((row) => {
          const on = row.querySelector('.day-on').checked;
          workingHours[row.dataset.day] = on
            ? [{ start: row.querySelector('.day-start').value, end: row.querySelector('.day-end').value }]
            : [];
        });
        const body = {
          machineCode: $('fldCode').value.trim(),
          machineName: $('fldName').value.trim(),
          model: $('fldModel').value.trim() || null,
          status: $('fldStatus').value,
          defaultSetupTime: Number($('fldSetup').value),
          defaultCleaningTime: Number($('fldClean').value),
          supportedProductIds: [...$('fldProducts').querySelectorAll('input:checked')].map((c) => c.value),
          workingHours,
        };
        try {
          if (editingId) await api(`/machines/${editingId}`, { method: 'PUT', body });
          else await api('/machines', { method: 'POST', body });
          $('formModal').hidden = true;
          toast('已儲存', 'success');
          loadAll();
        } catch (err) { $('formError').innerHTML = `<div class="banner banner-error">${escapeHtml(err.message)}</div>`; }
      });

      // ====== 停機時段 ======
      function openDt(machineId) {
        dtMachineId = machineId;
        const m = machines.find((x) => x.id === machineId);
        $('dtTitle').textContent = `新增停機時段 — ${m.machineName}`;
        $('dtError').innerHTML = '';
        $('dtType').value = 'maintenance';
        $('dtStart').value = ''; $('dtEnd').value = ''; $('dtReason').value = '';
        $('dtModal').hidden = false;
      }
      $('btnDtSave').addEventListener('click', async () => {
        if (!$('dtStart').value || !$('dtEnd').value) return toast('請填開始與結束時間', 'warn');
        try {
          await api(`/machines/${dtMachineId}/downtimes`, { method: 'POST', body: {
            type: $('dtType').value,
            startTime: fromLocalInput($('dtStart').value),
            endTime: fromLocalInput($('dtEnd').value),
            reason: $('dtReason').value.trim() || null,
          }});
          $('dtModal').hidden = true; toast('已新增', 'success'); loadAll();
        } catch (err) { $('dtError').innerHTML = `<div class="banner banner-error">${escapeHtml(err.message)}</div>`; }
      });

      // ====== 換模規則 ======
      function renderRules() {
        const rows = rules.map((r) => `<tr>
          <td>${escapeHtml(machineName(r.machineId))}</td>
          <td>${escapeHtml(productName(r.fromProductId))}</td>
          <td>${escapeHtml(productName(r.toProductId))}</td>
          <td class="num">${r.setupMinutes}</td>
          <td class="num">${r.cleaningMinutes}</td>
          <td class="right"><button class="btn btn-ghost btn-sm" data-delrule="${r.id}">✕</button></td></tr>`).join('');
        const pOpts = products.map((p) => `<option value="${p.id}">${escapeHtml(p.productCode)}</option>`).join('');
        const mOpts = machines.map((m) => `<option value="${m.id}">${escapeHtml(m.machineCode)}</option>`).join('');
        $('rulesArea').innerHTML = `<div class="table-wrap"><table class="table">
          <thead><tr><th>機台</th><th>從產品</th><th>到產品</th><th class="num">換模</th><th class="num">清洗</th><th></th></tr></thead>
          <tbody>${rows}
            <tr>
              <td><select class="input" id="rMachine"><option value="">所有機台</option>${mOpts}</select></td>
              <td><select class="input" id="rFrom"><option value="">(空機/任何)</option>${pOpts}</select></td>
              <td><select class="input" id="rTo"><option value="">選擇產品</option>${pOpts}</select></td>
              <td><input class="input" id="rSetup" type="number" min="0" value="30" style="width:80px"/></td>
              <td><input class="input" id="rClean" type="number" min="0" value="15" style="width:80px"/></td>
              <td class="right"><button class="btn btn-primary btn-sm" id="btnAddRule">新增</button></td>
            </tr></tbody></table></div>`;
      }
      $('rulesArea').addEventListener('click', async (e) => {
        const t = e.target.closest('button');
        if (!t) return;
        if (t.id === 'btnAddRule') {
          if (!$('rTo').value) return toast('請選擇「到產品」', 'warn');
          try {
            await api('/changeover-rules', { method: 'POST', body: {
              machineId: $('rMachine').value || null,
              fromProductId: $('rFrom').value || null,
              toProductId: $('rTo').value,
              setupMinutes: Number($('rSetup').value),
              cleaningMinutes: Number($('rClean').value),
            }});
            rules = await api('/changeover-rules'); renderRules();
          } catch (err) { toast(err.message, 'error'); }
        } else if (t.dataset.delrule) {
          try { await api(`/changeover-rules/${t.dataset.delrule}`, { method: 'DELETE' }); rules = await api('/changeover-rules'); renderRules(); }
          catch (err) { toast(err.message, 'error'); }
        }
      });

      // ====== 開關 ======
      $('btnAdd').addEventListener('click', () => openForm(null));
      $('btnRules').addEventListener('click', () => { renderRules(); $('rulesModal').hidden = false; });
      document.querySelectorAll('[data-close]').forEach((b) =>
        b.addEventListener('click', (e) => { e.target.closest('.modal-overlay').hidden = true; }));

      (async () => {
        if (!(await checkBackend())) { $('listArea').innerHTML = ''; return; }
        try { await loadAll(); }
        catch (e) { $('listArea').innerHTML = `<div class="banner banner-error">${escapeHtml(e.message)}</div>`; }
      })();
    </script>
  </body>
</html>
